name: Bug
description: Something in the app, CLI or Action doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Desktop app, CLI, GitHub Action, Website]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "Windows 11, Cartographer 1.4.0"
  - type: textarea
    id: logs
    attributes:
      label: Error output or screenshot
      render: text
