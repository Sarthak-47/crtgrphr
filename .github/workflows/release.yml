name: Release

# Pushing a tag like v0.2.0 builds installers for every platform, smoke-tests
# the packaged app on each OS, and publishes a GitHub Release with the installers.
# Running it by hand (Actions → Release → Run workflow) builds and tests the
# installers as downloadable artifacts, without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/*.exe
          - os: ubuntu-latest
            target: --linux
            files: release/*.AppImage
          - os: macos-latest
            target: --mac
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: node scripts/dist.mjs ${{ matrix.target }} --publish never

      - name: Smoke-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node tests/e2e/packaged.mjs
        env:
          CI: '1'

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        run: node tests/e2e/packaged.mjs
        env:
          CI: '1'

      - name: Smoke-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: node tests/e2e/packaged.mjs
        env:
          CI: '1'

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish:
    # On a tag: verify, then publish. Run by hand: the same checks as a dry run
    # (nothing is attested or published).
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance (Sigstore), verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Add the command-line tool
        run: cp action/dist/crtgrphr.mjs dist/crtgrphr.mjs

      - name: Verify the release contents
        # Every platform's installer is here, named for this tag, and the CLI
        # reports the same version, before anything is published.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(node -p "require('./package.json').version")"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -la dist
          for f in "Cartographer-Setup-$version.exe" "Cartographer-$version-arm64.dmg" "Cartographer-$version-x86_64.AppImage" crtgrphr.mjs; do
            test -s "dist/$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done
          test "$(node dist/crtgrphr.mjs --version)" = "$version" || { echo "::error::crtgrphr.mjs is not version $version"; exit 1; }

      - name: Software bill of materials (CycloneDX)
        # The whole dependency tree, including Electron, which ships inside the app.
        run: npm sbom --sbom-format cyclonedx --package-lock-only > "dist/cartographer-$VERSION-sbom.cdx.json"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    # The command-line tool on npm (`npx crtgrphr`), published from the same tag with
    # npm provenance. Skipped until the repository has an NPM_TOKEN secret.
    name: publish to npm
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Stage the package
        run: node scripts/npm-package.mjs --check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: the npm package was staged and checked, not published."
            exit 0
          fi
          cd release/npm
          npm publish --provenance --access public
