name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E (Electron, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/e2e/run.mjs
        env:
          CI: '1'

      - name: E2E (Electron, Windows)
        if: runner.os == 'Windows'
        run: node tests/e2e/run.mjs
        env:
          CI: '1'
