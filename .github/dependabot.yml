# Weekly dependency updates as pull requests (each one runs CI, including the
# E2E and Action tests). Minor and patch updates are grouped to keep the noise
# down; major versions come one by one, since they can break the build.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Electron majors are upgraded deliberately (see CHANGELOG 1.3.0), not by a bot.
    ignore:
      - dependency-name: electron
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
