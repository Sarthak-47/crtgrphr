services:
  config-server:
    build: ./config
    ports: ["8888:8888"]
  api-gateway:
    build: ./gateway
    ports: ["8080:8080"]
    depends_on: [config-server]
  customers-service:
    build: ./customers
    ports: ["8081:8081"]
    depends_on: [config-server]
  grafana-server:
    build: ./grafana
    ports: ["3030:3000"]
  prometheus-server:
    image: prom/prometheus:v2.4.2
    ports: ["9091:9090"]
