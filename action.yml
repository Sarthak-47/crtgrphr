name: Cartographer architecture map
description: Keep an architecture map in sync with the code. Fails, or updates the map, when the code changes.
author: Sarthak-47
branding:
  icon: map
  color: blue

inputs:
  path:
    description: Folder to scan (the repository root by default).
    default: .
  map:
    description: The committed map file (.crtgrphr). Created on the first run if it doesn't exist.
    default: docs/architecture.crtgrphr
  mode:
    description: >
      check: fail when the map no longer matches the code (for pull requests).
      update: rewrite the map and its exports when the code changed (commit them in a later step).
    default: check
  mermaid:
    description: Also write the map as Mermaid to this path (.md gives a fenced block for READMEs).
    default: ''
  svg:
    description: Also write the map as an SVG image to this path.
    default: ''
  drawio:
    description: Also write the map as a draw.io file to this path.
    default: ''
  c4:
    description: Also write the map as a C4 container diagram (C4-PlantUML) to this path.
    default: ''
  theme:
    description: SVG theme, light or dark.
    default: light
  strict:
    description: >
      "true" to also treat detail changes as drift (file counts in sublabels, import
      counts on links). By default only structure counts: parts and links added or
      removed, parts renamed or changing kind.
    default: 'false'

  helm:
    description: >
      "true" to render Helm charts with helm (preinstalled on GitHub's runners) so the
      map shows the workloads they deploy. Chart dependencies are not downloaded.
    default: 'false'

  comment:
    description: >
      "true" to post the drift report (with its picture) as a comment on the pull
      request, updated in place on later runs. Needs `permissions: pull-requests: write`.
    default: 'false'
  token:
    description: Token used to comment. The workflow's own token is enough.
    default: ${{ github.token }}

outputs:
  drifted:
    description: '"true" when the code had changed since the map was made, otherwise "false".'
    value: ${{ steps.map.outputs.drifted }}
  report:
    description: Path of the Markdown drift report (also added to the job summary).
    value: ${{ steps.map.outputs.report }}

runs:
  using: composite
  steps:
    - id: map
      shell: bash
      env:
        CG_PATH: ${{ inputs.path }}
        CG_MAP: ${{ inputs.map }}
        CG_MODE: ${{ inputs.mode }}
        CG_MERMAID: ${{ inputs.mermaid }}
        CG_SVG: ${{ inputs.svg }}
        CG_DRAWIO: ${{ inputs.drawio }}
        CG_C4: ${{ inputs.c4 }}
        CG_THEME: ${{ inputs.theme }}
        CG_STRICT: ${{ inputs.strict }}
        CG_HELM: ${{ inputs.helm }}
        CG_BIN: ${{ github.action_path }}/action/dist/crtgrphr.mjs
      run: |
        # GitHub runs `shell: bash` with -e; exit codes are handled below instead
        # (1 means drift, which must not stop the script before it reports).
        set +e -uo pipefail
        exports=()
        [ -n "$CG_MERMAID" ] && exports+=(--mermaid "$CG_MERMAID")
        [ -n "$CG_SVG" ] && exports+=(--svg "$CG_SVG")
        [ -n "$CG_DRAWIO" ] && exports+=(--drawio "$CG_DRAWIO")
        [ -n "$CG_C4" ] && exports+=(--c4 "$CG_C4")
        flags=()
        [ "$CG_STRICT" = "true" ] && flags+=(--strict)
        [ "$CG_HELM" = "true" ] && flags+=(--helm)
        report="${RUNNER_TEMP:-/tmp}/crtgrphr-report.md"
        echo "report=$report" >> "$GITHUB_OUTPUT"

        if [ ! -f "$CG_MAP" ]; then
          echo "No map at $CG_MAP yet: creating it."
          node "$CG_BIN" scan "$CG_PATH" --out "$CG_MAP" --theme "$CG_THEME" "${flags[@]}" "${exports[@]}" || exit 2
          printf '## Architecture map created\n\n`%s` was created from the code. Commit it to start tracking drift.\n' "$CG_MAP" > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "drifted=true" >> "$GITHUB_OUTPUT"
          if [ "$CG_MODE" != "update" ]; then
            echo "fail=No committed architecture map at $CG_MAP. Run the action in update mode, or crtgrphr scan --out $CG_MAP, and commit it." >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        case "$CG_MODE" in
          check)
            node "$CG_BIN" check "$CG_PATH" --map "$CG_MAP" --report "$report" "${flags[@]}"
            code=$?
            ;;
          update)
            node "$CG_BIN" check "$CG_PATH" --map "$CG_MAP" --report "$report" "${flags[@]}" -q
            code=$?
            if [ "$code" = "1" ]; then
              node "$CG_BIN" check "$CG_PATH" --map "$CG_MAP" --update --report "$report" "${flags[@]}" --theme "$CG_THEME" "${exports[@]}" -q || exit 2
              code=1
            elif [ "$code" = "0" ] && [ "${#exports[@]}" -gt 0 ]; then
              # Up to date, but keep the exports in step with the map file.
              node "$CG_BIN" export "$CG_MAP" --theme "$CG_THEME" "${exports[@]}" -q || exit 2
            fi
            ;;
          *)
            echo "::error::mode must be check or update, got '$CG_MODE'"
            exit 2
            ;;
        esac

        [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
        # This step always succeeds when the check ran, so its outputs reach the
        # caller; the next step fails the job on drift.
        if [ "$code" = "1" ]; then
          echo "drifted=true" >> "$GITHUB_OUTPUT"
          if [ "$CG_MODE" = "check" ]; then
            echo "fail=The architecture map is out of date with the code. See the job summary." >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi
        echo "drifted=false" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CG_REPORT: ${{ steps.map.outputs.report }}
        CG_DRIFTED: ${{ steps.map.outputs.drifted }}
        CG_PR: ${{ github.event.pull_request.number }}
        CG_REPO: ${{ github.repository }}
      run: |
        # One comment per pull request, found again by a hidden marker and updated
        # in place: posted when the map drifts, switched to "up to date" once fixed.
        set +e -uo pipefail
        marker='<!-- crtgrphr-drift -->'
        [ -f "$CG_REPORT" ] || exit 0
        body="$(printf '%s\n\n' "$marker"; cat "$CG_REPORT")"
        existing=$(gh api "repos/$CG_REPO/issues/$CG_PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$CG_REPO/issues/comments/$existing" -f body="$body" > /dev/null || echo "::warning::couldn't update the drift comment"
        elif [ "$CG_DRIFTED" = "true" ]; then
          gh api -X POST "repos/$CG_REPO/issues/$CG_PR/comments" -f body="$body" > /dev/null || echo "::warning::couldn't comment (does the workflow grant pull-requests: write?)"
        fi

    - name: Fail on drift
      if: steps.map.outputs.fail != ''
      shell: bash
      env:
        CG_MAP: ${{ inputs.map }}
        CG_FAIL: ${{ steps.map.outputs.fail }}
      run: |
        echo "::error file=$CG_MAP::$CG_FAIL"
        exit 1
